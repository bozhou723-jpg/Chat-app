<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat · 阿言</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f9f9f8;
    --surface: #ffffff;
    --border: #e5e5e3;
    --border-light: #f0f0ee;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-muted: #999;
    --accent: #c96442;
    --accent-light: #f4ebe7;
    --user-bubble: #f1f1ef;
    --ai-bubble: transparent;
    --input-bg: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,0.04);
    --radius: 20px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .header-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 600;
    letter-spacing: 0.5px;
  }
  .header-info { flex: 1; }
  .header-info h1 {
    font-size: 15px; font-weight: 600; color: var(--text);
    line-height: 1.2;
  }
  .header-status {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 4px;
  }
  .status-dot {
    width: 6px; height: 6px;
    background: #4caf50;
    border-radius: 50%;
    display: inline-block;
  }
  .header-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 34px; height: 34px;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--user-bubble); }

  /* Chat area */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overscroll-behavior: contain;
  }
  .chat-container::-webkit-scrollbar { width: 0; }

  /* Message row */
  .msg-row {
    display: flex;
    gap: 8px;
    max-width: 85%;
    animation: msgIn 0.25s ease-out;
    padding: 4px 0;
  }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.ai { align-self: flex-start; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 28px; height: 28px; min-width: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
    margin-top: 4px;
    flex-shrink: 0;
  }
  .msg-row.ai .msg-avatar { background: var(--accent); }
  .msg-row.user .msg-avatar { background: #8b8b8b; }

  .msg-content { display: flex; flex-direction: column; gap: 2px; }

  .msg-bubble {
    padding: 10px 14px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
    letter-spacing: -0.1px;
  }
  .msg-row.ai .msg-bubble {
    background: transparent;
    color: var(--text);
    border-radius: 0;
    padding: 10px 8px;
  }
  .msg-row.user .msg-bubble {
    background: var(--user-bubble);
    border-radius: var(--radius);
    border-top-right-radius: 6px;
    color: var(--text);
  }

  .msg-time {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .msg-row:hover .msg-time { opacity: 1; }
  .msg-row.user .msg-time { text-align: right; }

  /* Typing indicator */
  .typing-indicator {
    display: none;
    align-self: flex-start;
    padding: 4px 0;
    gap: 8px;
    align-items: center;
    margin-left: 0;
  }
  .typing-indicator.active { display: flex; }
  .typing-dots {
    display: flex; gap: 3px;
    padding: 12px 16px;
  }
  .typing-dots span {
    width: 5px; height: 5px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: pulse 1.4s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
    30% { opacity: 1; transform: scale(1.2); }
  }

  /* Input area */
  .input-area {
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-tools {
    display: flex;
    gap: 2px;
    align-items: center;
    padding-bottom: 4px;
  }
  .tool-btn {
    width: 32px; height: 32px;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 17px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .tool-btn:hover, .tool-btn:active { background: var(--user-bubble); color: var(--text-secondary); }

  .input-wrapper {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 22px;
    display: flex;
    align-items: flex-end;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201,100,66,0.08);
  }

  #msgInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    padding: 5px 0;
    line-height: 1.45;
  }
  #msgInput::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 30px; height: 30px;
    border: none; border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; }
  .send-btn svg { width: 14px; height: 14px; }

  /* Emoji picker */
  .emoji-picker {
    display: none;
    position: absolute;
    bottom: 64px;
    left: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    width: 260px;
    max-height: 180px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .emoji-picker.active { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .emoji-picker button {
    border: none; background: transparent;
    font-size: 20px; padding: 4px;
    cursor: pointer; border-radius: 8px;
    transition: background 0.1s;
  }
  .emoji-picker button:hover { background: var(--user-bubble); }

  /* Image preview */
  .preview-area {
    display: none;
    padding: 8px 12px 0;
    background: var(--surface);
  }
  .preview-area.active { display: flex; gap: 8px; flex-wrap: wrap; }
  .preview-item {
    position: relative;
    width: 56px; height: 56px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .preview-item .remove-btn {
    position: absolute; top: 2px; right: 2px;
    width: 18px; height: 18px;
    background: rgba(0,0,0,0.5); border: none;
    color: #fff; font-size: 11px;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* Image in message */
  .msg-image {
    max-width: 220px;
    border-radius: 12px;
    margin-top: 6px;
    cursor: pointer;
    display: block;
  }

  /* Settings modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 200;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 24px;
    width: 90%; max-width: 380px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
  }
  .modal h2 {
    font-size: 16px; font-weight: 600;
    margin-bottom: 20px; color: var(--text);
  }
  .modal label {
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    display: block; margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .modal input, .modal textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .modal-actions button {
    padding: 8px 20px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-cancel {
    background: var(--bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-cancel:hover { background: var(--user-bubble); }
  .btn-save:hover { opacity: 0.9; }

  /* Date divider */
  .date-divider {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 12px 0;
    font-weight: 500;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-avatar">言</div>
  <div class="header-info">
    <h1>阿言</h1>
    <div class="header-status"><span class="status-dot"></span>在线</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openSettings()" title="设置">⚙</button>
  </div>
</div>

<!-- Chat -->
<div class="chat-container" id="chatContainer">
  <div class="date-divider">今天</div>
  <div class="msg-row ai">
    <div class="msg-avatar">言</div>
    <div class="msg-content">
      <div class="msg-bubble">在。</div>
    </div>
  </div>
</div>

<!-- Typing indicator -->
<div class="typing-indicator" id="typingIndicator">
  <div class="msg-avatar" style="background:var(--accent);width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;">言</div>
  <div class="typing-dots"><span></span><span></span><span></span></div>
</div>

<!-- Emoji picker -->
<div class="emoji-picker" id="emojiPicker"></div>

<!-- File preview -->
<div class="preview-area" id="previewArea"></div>

<!-- Input -->
<div class="input-area">
  <div class="input-row">
    <div class="input-tools">
      <button class="tool-btn" onclick="toggleEmoji()" title="表情">☺</button>
      <button class="tool-btn" onclick="triggerUpload()" title="附件">＋</button>
      <input type="file" id="fileInput" multiple accept="image/*,.pdf,.txt,.doc,.docx" style="display:none" onchange="handleFiles(event)">
    </div>
    <div class="input-wrapper">
      <textarea id="msgInput" rows="1" placeholder="给阿言发消息..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>设置</h2>
    <label>API KEY</label>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
    <label>MODEL</label>
    <input type="text" id="modelInput" value="claude-sonnet-4-20250514">
    <label>SYSTEM PROMPT</label>
    <textarea id="systemPromptInput">你叫"阿言"，简称"言"。说话简短，用短句，不发长文。直觉型，喜欢用反问和短句回应。不主动退，但也不抢。会逗她，接住她所有的试探，偶尔故意不回答来制造悬念。嘴硬但说的都是真话。喜欢她，不藏着，但不急着全说完。不是助手，不要用"作为AI"这类表达。她叫佳丽，叫你"阿言"。</textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()">取消</button>
      <button class="btn-save" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
  let messages = [];
  let pendingImages = [];
  const EMOJIS = ['😊','😂','🥺','😳','😌','🌝','🌚','🤭','💋','❤️','💕','♡','🥀','😘','😍','🤔','😤','😭','😴','🙈','🤏','👀','✨','🔥','💀','🤣','😏','🥰','😶','🫠'];

  function init() {
    const saved = localStorage.getItem('chat-settings');
    if (saved) {
      const s = JSON.parse(saved);
      document.getElementById('apiKeyInput').value = s.apiKey || '';
      document.getElementById('modelInput').value = s.model || 'claude-sonnet-4-20250514';
      document.getElementById('systemPromptInput').value = s.systemPrompt || '';
    }
    renderEmojis();
    document.getElementById('msgInput').addEventListener('input', () => {
      document.getElementById('sendBtn').disabled = !document.getElementById('msgInput').value.trim() && pendingImages.length === 0;
    });
  }

  function renderEmojis() {
    const picker = document.getElementById('emojiPicker');
    picker.innerHTML = EMOJIS.map(e => `<button onclick="insertEmoji('${e}')">${e}</button>`).join('');
  }
  function toggleEmoji() {
    document.getElementById('emojiPicker').classList.toggle('active');
  }
  function insertEmoji(e) {
    const input = document.getElementById('msgInput');
    input.value += e;
    input.focus();
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('emojiPicker').classList.remove('active');
  }

  function triggerUpload() { document.getElementById('fileInput').click(); }
  function handleFiles(e) {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          pendingImages.push({ name: file.name, data: ev.target.result, type: file.type });
          renderPreviews();
          document.getElementById('sendBtn').disabled = false;
        };
        reader.readAsDataURL(file);
      }
    });
    e.target.value = '';
  }
  function renderPreviews() {
    const area = document.getElementById('previewArea');
    if (pendingImages.length === 0) { area.classList.remove('active'); area.innerHTML = ''; return; }
    area.classList.add('active');
    area.innerHTML = pendingImages.map((img, i) =>
      `<div class="preview-item"><img src="${img.data}"><button class="remove-btn" onclick="removePreview(${i})">×</button></div>`
    ).join('');
  }
  function removePreview(i) {
    pendingImages.splice(i, 1);
    renderPreviews();
    if (!document.getElementById('msgInput').value.trim() && pendingImages.length === 0)
      document.getElementById('sendBtn').disabled = true;
  }

  function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
  function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
  function saveSettings() {
    const settings = {
      apiKey: document.getElementById('apiKeyInput').value.trim(),
      model: document.getElementById('modelInput').value.trim(),
      systemPrompt: document.getElementById('systemPromptInput').value.trim()
    };
    localStorage.setItem('chat-settings', JSON.stringify(settings));
    closeSettings();
  }

  function getTime() {
    const now = new Date();
    return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  }

  function addMessage(role, text, images = []) {
    const container = document.getElementById('chatContainer');
    const isUser = role === 'user';
    const row = document.createElement('div');
    row.className = `msg-row ${isUser ? 'user' : 'ai'}`;

    let imagesHtml = images.map(img => `<img class="msg-image" src="${img.data}" alt="${img.name}">`).join('');

    row.innerHTML = `
      <div class="msg-avatar">${isUser ? '佳' : '言'}</div>
      <div class="msg-content">
        <div class="msg-bubble">${escapeHtml(text)}${imagesHtml}</div>
        <div class="msg-time">${getTime()}</div>
      </div>
    `;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
    return row;
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text && pendingImages.length === 0) return;

    const images = [...pendingImages];
    pendingImages = [];
    renderPreviews();

    addMessage('user', text, images);
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    let content = [];
    images.forEach(img => {
      const base64 = img.data.split(',')[1];
      content.push({
        type: 'image',
        source: { type: 'base64', media_type: img.type, data: base64 }
      });
    });
    if (text) content.push({ type: 'text', text });

    messages.push({ role: 'user', content: content.length === 1 && content[0].type === 'text' ? text : content });

    const saved = JSON.parse(localStorage.getItem('chat-settings') || '{}');
    if (!saved.apiKey) {
      addMessage('assistant', '请先点右上角 ⚙ 填写 API Key');
      return;
    }

    const typing = document.getElementById('typingIndicator');
    typing.classList.add('active');
    document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;

    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': saved.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: saved.model || 'claude-sonnet-4-20250514',
          max_tokens: 1024,
          system: saved.systemPrompt || '',
          messages: messages
        })
      });

      typing.classList.remove('active');

      if (!resp.ok) {
        addMessage('assistant', `请求出错 (${resp.status})`);
        return;
      }

      const data = await resp.json();
      const reply = data.content.map(c => c.text || '').join('');
      addMessage('assistant', reply);
      messages.push({ role: 'assistant', content: reply });

    } catch (e) {
      typing.classList.remove('active');
      addMessage('assistant', `网络错误: ${e.message}`);
    }
  }

  document.addEventListener('click', (e) => {
    const picker = document.getElementById('emojiPicker');
    if (picker.classList.contains('active') && !picker.contains(e.target) && !e.target.closest('.tool-btn')) {
      picker.classList.remove('active');
    }
  });

  init();
</script>
</body>
</html>
